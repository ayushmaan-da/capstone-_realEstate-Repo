<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./create new.css">
</head>
<body>
     <nav class="head">
        <a href="#">
            <img  class="logo1" src="assests/logo.png" alt="logo">
        </a>
    </nav>
    <div class="login-outer">
        <div class="login">
            <h1 class="head1">Create a new account</h1>
            <br><br>
            <form action="#" method="post">
            <input type="text" name="name" id="login-name" placeholder="First name" required>
            <input type="text" name="surname" id="login-surname" placeholder="Surname" >
            <br><br>
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" min="2007-01-01" required>
            <br><br>
            <input type="text" name="email" id="login-mail" placeholder="Mobile number or email address" required>
            <br><br>

        <button class="sign-btn">
            <a class="sig" href="./capstone.html">Sign Up</a>
        </button>
        <div class="alreadyacc-container">
        <a href="./login.html" class="alreadyacc">Already have an account?</a>
        </div>
        </form>
        </div>
    </div>
</body>
</html>
